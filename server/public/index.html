<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaSphere 대시보드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>MediaSphere</h1>
    <div class="header-info">
      <span id="online-count">온라인: 000 / 000</span>
      <span id="file-status-count" class="file-status-count">파일: 정상 0 / 불일치 0 / 무응답 0</span>
      <span id="ota-status-count" class="file-status-count">OTA: 대기 0 / 다운 0 / 설치 0 / 완료 0 / 실패 0</span>
      <button id="btn-show-id" class="btn-small">ID 표시</button>
      <span id="play-state" class="play-state stopped">■ 정지</span>
      <span id="timecode" class="timecode"></span>
      <span class="color-status">
        <span id="color-swatch" class="color-swatch"></span>
        <span id="color-label">컬러: 없음</span>
        <button id="btn-color-reset" class="btn-small">초기화</button>
      </span>
    </div>
  </header>

  <section class="controls">
    <div class="mode-toggle">
      <button id="mode-video" class="mode-btn active">영상 모드</button>
      <button id="mode-pattern" class="mode-btn">패턴 모드</button>
      <button id="mode-text" class="mode-btn">텍스트 모드</button>
    </div>

    <div id="video-controls" class="control-group">
      <button id="btn-play" class="btn btn-play">PLAY</button>
      <button id="btn-stop" class="btn btn-stop">STOP</button>
    </div>

    <div id="pattern-controls" class="control-group pattern-controls disabled">
      <label class="pattern-field">
        색상
        <input type="color" id="pattern-color" value="#ffffff" disabled />
      </label>
      <label class="pattern-field">
        주기(ms)
        <input type="number" id="pattern-interval" min="50" step="50" value="500" disabled />
      </label>
      <label class="pattern-field">
        지속시간(ms)
        <input type="number" id="pattern-duration" min="0" step="500" value="3000" disabled />
      </label>
      <label class="pattern-field">
        폰 간 딜레이 (ms)
        <input type="number" id="pattern-step-delay" min="0" step="50" value="200" disabled />
      </label>
      <button id="btn-pattern-play" class="btn btn-play" disabled>Pattern PLAY</button>
      <button id="btn-pattern-stop" class="btn btn-stop" disabled>Pattern STOP</button>
      <button id="btn-sequence-play" class="btn btn-play" disabled>순차 점멸 시작</button>
      <button id="btn-sequence-stop" class="btn btn-stop" disabled>순차 점멸 정지</button>
    </div>

    <div id="text-pattern-controls" class="control-group pattern-controls disabled">
      <label class="pattern-field text-field-wide">
        텍스트 패턴 (줄바꿈으로 여러 단어 - 한 단어씩 순환 표시)
        <textarea id="text-pattern-content" rows="3" disabled>Hi</textarea>
      </label>
      <label class="pattern-field">
        글자색
        <input type="color" id="text-pattern-fg-color" value="#ffffff" disabled />
      </label>
      <label class="pattern-field">
        배경색
        <input type="color" id="text-pattern-bg-color" value="#000000" disabled />
      </label>
      <label class="pattern-field">
        글자당 딜레이(ms)
        <input type="number" id="text-pattern-char-stagger" min="0" step="50" value="400" disabled />
      </label>
      <label class="pattern-field">
        페이드인(ms)
        <input type="number" id="text-pattern-fade-in" min="0" step="50" value="400" disabled />
      </label>
      <label class="pattern-field">
        유지시간(ms)
        <input type="number" id="text-pattern-hold" min="0" step="500" value="3000" disabled />
      </label>
      <label class="pattern-field">
        페이드아웃(ms)
        <input type="number" id="text-pattern-fade-out" min="0" step="50" value="400" disabled />
      </label>
      <button id="btn-text-pattern-start" class="btn btn-play" disabled>텍스트 패턴 시작</button>
      <button id="btn-text-pattern-stop" class="btn btn-stop" disabled>텍스트 패턴 정지</button>
    </div>

    <div id="text-controls" class="control-group pattern-controls disabled">
      <label class="pattern-field text-field-wide">
        텍스트 (줄바꿈 가능)
        <textarea id="text-content" rows="3" disabled>MediaSphere</textarea>
      </label>
      <label class="pattern-field">
        서체
        <select id="text-font" disabled>
          <option value="sans-serif">sans-serif</option>
          <option value="sans-serif-black">sans-serif-black</option>
          <option value="sans-serif-condensed">sans-serif-condensed</option>
          <option value="sans-serif-light">sans-serif-light</option>
          <option value="sans-serif-medium">sans-serif-medium</option>
          <option value="serif">serif</option>
          <option value="monospace">monospace</option>
          <option value="casual">casual</option>
          <option value="cursive">cursive</option>
        </select>
      </label>
      <label class="pattern-field">
        글자 크기(px)
        <input type="number" id="text-font-size" min="10" step="10" value="120" disabled />
      </label>
      <label class="pattern-field">
        글자색
        <input type="color" id="text-color" value="#ffffff" disabled />
      </label>
      <label class="pattern-field">
        배경색
        <input type="color" id="text-bg-color" value="#000000" disabled />
      </label>
      <label class="pattern-field">
        정렬
        <select id="text-align" disabled>
          <option value="left">왼쪽</option>
          <option value="center" selected>가운데</option>
          <option value="right">오른쪽</option>
        </select>
      </label>
      <label class="pattern-field">
        방향
        <select id="text-direction" disabled>
          <option value="left" selected>왼쪽으로</option>
          <option value="right">오른쪽으로</option>
          <option value="up">위로</option>
          <option value="down">아래로</option>
        </select>
      </label>
      <label class="pattern-field">
        속도(px/초)
        <input type="number" id="text-speed" min="10" step="10" value="200" disabled />
      </label>
      <button id="btn-text-start" class="btn btn-play" disabled>텍스트 시작</button>
      <button id="btn-text-stop" class="btn btn-stop" disabled>텍스트 정지</button>
    </div>
  </section>

  <section class="admin-section">
    <h2>앱 재시작</h2>
    <div class="admin-restart">
      <input id="restart-device-ids" type="text" placeholder="deviceId 쉼표 구분 (예: 1,2,3) - 비우면 아래 전체 버튼만" />
      <button id="btn-restart-selected" class="btn-small">선택 재시작</button>
      <button id="btn-restart-all" class="btn-small btn-danger">전체 재시작</button>
    </div>
  </section>

  <main>
    <section class="grid-section">
      <h2>기기 현황</h2>
      <div id="device-grid" class="device-grid"></div>
    </section>

    <section class="offline-section">
      <h2>오프라인 기기</h2>
      <div id="offline-list" class="offline-list">없음</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
