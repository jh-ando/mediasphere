<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaSphere 대시보드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>MediaSphere</h1>
    <div class="header-info">
      <span id="online-count">온라인: 000 / 000</span>
      <span id="file-status-count" class="file-status-count">파일: 정상 0 / 불일치 0 / 무응답 0</span>
      <span id="battery-status-count" class="file-status-count">배터리: 정상 0 / 낮음 0 / 미충전 0 / 확인불가 0</span>
      <button id="btn-show-id" class="btn-small">ID 표시</button>
      <span id="play-state" class="play-state stopped">■ 정지</span>
      <span id="timecode" class="timecode"></span>
      <details class="header-details">
        <summary>OTA/버전</summary>
        <div class="header-details-content">
          <span id="ota-status-count" class="file-status-count">OTA: 대기 0 / 다운 0 / 설치 0 / 완료 0 / 실패 0</span>
          <span id="version-status-count" class="file-status-count">버전: 확인 안 함</span>
          <button id="btn-version-toggle" class="btn-small">버전 확인 켜기</button>
        </div>
      </details>
    </div>
  </header>

  <section class="controls">
    <div class="mode-toggle">
      <button id="mode-video" class="mode-btn active">영상 모드</button>
      <button id="mode-pattern" class="mode-btn">패턴 모드</button>
      <button id="mode-text" class="mode-btn">텍스트 모드</button>
      <button id="btn-idle" class="mode-btn btn-idle">절전 모드</button>
    </div>

    <div id="video-controls" class="control-group">
      <button id="btn-play" class="btn btn-play">영상 재생</button>
      <button id="btn-stop" class="btn btn-stop">영상 정지</button>
    </div>

    <div id="pattern-controls" class="control-group pattern-controls" hidden>
      <label class="pattern-field">
        색상
        <input type="color" id="pattern-color" value="#ffffff" />
      </label>
      <label class="pattern-field pattern-field-checkbox" title="켜면 색상 선택을 무시하고 폰마다 각자 무작위 색을 표시합니다">
        색상 랜덤
        <input type="checkbox" id="pattern-color-random" />
      </label>
      <label class="pattern-field">
        주기(ms)
        <input type="number" id="pattern-interval" min="50" step="50" value="500" />
      </label>
      <label class="pattern-field">
        지속시간(ms)
        <input type="number" id="pattern-duration" min="0" step="500" value="3000" />
      </label>
      <label class="pattern-field">
        폰 간 딜레이 (ms)
        <input type="number" id="pattern-step-delay" min="0" step="50" value="200" />
      </label>
      <button id="btn-pattern-play" class="btn btn-play">전체 점멸 시작</button>
      <button id="btn-pattern-stop" class="btn btn-stop">전체 점멸 정지</button>
      <button id="btn-sequence-play" class="btn btn-play">순차 점멸 시작</button>
      <button id="btn-sequence-stop" class="btn btn-stop">순차 점멸 정지</button>

      <div class="playlist-section">
        <h3>재생목록</h3>
        <div class="playlist-cue-header">
          <span class="playlist-col-index">#</span>
          <span class="playlist-col-color">색상</span>
          <span class="playlist-col-checkbox" title="켜면 색상을 무시하고 폰마다 각자 무작위 색을 표시합니다">랜덤</span>
          <span class="playlist-col-num">주기(ms)</span>
          <span class="playlist-col-num" title="순차 점멸은 폰 한 대가 아니라 이 큐 전체가 지속되는 총 시간입니다">지속시간(ms)</span>
          <span class="playlist-col-num" title="폰 간 딜레이(ms) - 순차 점멸 전용">딜레이(ms)</span>
          <span class="playlist-col-mode">모드</span>
        </div>
        <div id="playlist-cues" class="playlist-cues"></div>
        <div class="video-replace-row">
          <button id="btn-playlist-add-cue" class="btn-small">+ 큐 추가</button>
          <button id="btn-playlist-save" class="btn-small">저장</button>
          <button id="btn-playlist-play" class="btn btn-play">재생</button>
          <button id="btn-playlist-stop" class="btn btn-stop">정지</button>
        </div>
        <div id="playlist-status" class="video-replace-status">재생 안 함</div>
      </div>
    </div>

    <div id="text-controls" class="control-group pattern-controls" hidden>
      <label class="pattern-field text-field-wide">
        텍스트 (줄바꿈 가능)
        <textarea id="text-content" rows="3">MediaSphere</textarea>
      </label>
      <label class="pattern-field">
        서체
        <select id="text-font">
          <option value="sans-serif">sans-serif</option>
          <option value="sans-serif-black">sans-serif-black</option>
          <option value="sans-serif-condensed">sans-serif-condensed</option>
          <option value="sans-serif-light">sans-serif-light</option>
          <option value="sans-serif-medium">sans-serif-medium</option>
          <option value="serif">serif</option>
          <option value="monospace">monospace</option>
          <option value="casual">casual</option>
          <option value="cursive">cursive</option>
        </select>
      </label>
      <label class="pattern-field">
        글자 크기(px)
        <input type="number" id="text-font-size" min="10" step="10" value="120" />
      </label>
      <label class="pattern-field">
        글자색
        <input type="color" id="text-color" value="#ffffff" />
      </label>
      <label class="pattern-field">
        배경색
        <input type="color" id="text-bg-color" value="#000000" />
      </label>
      <label class="pattern-field">
        정렬
        <select id="text-align">
          <option value="left">왼쪽</option>
          <option value="center" selected>가운데</option>
          <option value="right">오른쪽</option>
        </select>
      </label>
      <label class="pattern-field">
        방향
        <select id="text-direction">
          <option value="left" selected>왼쪽으로</option>
          <option value="right">오른쪽으로</option>
          <option value="up">위로</option>
          <option value="down">아래로</option>
        </select>
      </label>
      <label class="pattern-field">
        속도(px/초)
        <input type="number" id="text-speed" min="10" step="10" value="200" />
      </label>
      <button id="btn-text-start" class="btn btn-play">텍스트 시작</button>
      <button id="btn-text-stop" class="btn btn-stop">텍스트 정지</button>
    </div>
  </section>

  <section class="admin-section">
    <h2>앱 재시작</h2>
    <div class="admin-restart">
      <input id="restart-device-ids" type="text" placeholder="deviceId 쉼표 구분 (예: 1,2,3) - 비우면 아래 전체 버튼만" />
      <button id="btn-restart-selected" class="btn-small">선택 재시작</button>
      <button id="btn-restart-all" class="btn-small btn-danger">전체 재시작</button>
    </div>
  </section>

  <main>
    <section class="grid-section">
      <h2>기기 현황</h2>
      <div id="device-grid" class="device-grid"></div>
    </section>

    <section class="offline-section">
      <h2>오프라인 기기</h2>
      <div id="offline-list" class="offline-list">없음</div>
    </section>
  </main>

  <section class="admin-section video-replace">
    <h2>영상 교체</h2>
    <div class="video-replace-mode">
      <label><input type="radio" name="vr-mode" value="equirect" checked /> 등장방형 영상으로 교체 (4096x2048 기준)</label>
      <label><input type="radio" name="vr-mode" value="frontback" /> 일반(1:1) 영상 - 전/후면 교체 (2160x2160 기준)</label>
    </div>

    <div class="video-replace-row">
      <input type="file" id="vr-file" accept="video/*" />
      <button id="btn-vr-start" class="btn btn-play">교체 시작</button>
      <button id="btn-vr-cancel" class="btn-small btn-danger" disabled>취소</button>
    </div>

    <div id="vr-status" class="video-replace-status">대기 중</div>
    <pre id="vr-log" class="video-replace-log"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
